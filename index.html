<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassidy Paving — Sales Dashboard</title>
<style>
  :root{
    --bg-1:#0a0e14;--bg-2:#141c28;--bg-3:#1a1a1a;
    --red:#CC0000;--red-glow:rgba(204,0,0,0.4);--red-soft:rgba(204,0,0,0.12);
    --blue:#4ea8ff;--blue-glow:rgba(78,168,255,0.4);--blue-soft:rgba(78,168,255,0.12);
    --gold:#ffd700;--gold-soft:rgba(255,215,0,0.12);--gold-edge:rgba(255,200,0,0.35);
    --green:#3ddc91;--ok:#3ddc91;--warn:#ffb13b;--bad:#ff5b5b;
    --txt:#fff;--mute:#aaa;--dim:#777;
    --card-bg:rgba(255,255,255,0.025);--card-bd:rgba(255,255,255,0.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 40%,var(--bg-3) 100%);
    color:var(--txt);min-height:100vh;padding:18px 24px;
    overflow-x:hidden;
  }
  /* HEADER */
  .header{
    display:flex;align-items:center;justify-content:center;gap:25px;
    padding-bottom:14px;position:relative;margin-bottom:18px;
  }
  .header::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent 5%,var(--red) 30%,#ff3333 50%,var(--red) 70%,transparent 95%);
    box-shadow:0 0 15px var(--red-glow);
  }
  .logo{height:60px;filter:drop-shadow(0 0 8px rgba(204,0,0,0.3))}
  .hdiv{width:3px;height:46px;background:var(--red);border-radius:2px}
  .htxt h1{font-size:2rem;font-weight:800;letter-spacing:3px;color:#fff;line-height:1}
  .htxt h1 span{color:var(--red)}
  .htxt p{font-size:0.78rem;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:5px}
  .asof{position:absolute;right:0;top:6px;text-align:right;font-size:0.65rem;color:var(--dim);letter-spacing:1px}
  .asof b{color:var(--mute);font-weight:600}

  /* TOP KPI STRIP */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
  .kpi-card{
    background:linear-gradient(135deg,var(--red-soft),rgba(30,5,5,0.5));
    backdrop-filter:blur(12px);
    border:1px solid rgba(204,0,0,0.35);border-radius:14px;
    padding:14px 16px 12px;position:relative;overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06),0 0 14px rgba(204,0,0,0.08);
    animation:breathe 4.5s ease-in-out infinite;
  }
  .kpi-card.blue{
    background:linear-gradient(135deg,var(--blue-soft),rgba(5,15,30,0.5));
    border-color:rgba(78,168,255,0.35);
    box-shadow:0 4px 20px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06),0 0 14px rgba(78,168,255,0.08);
  }
  .kpi-card.gold{
    background:linear-gradient(135deg,var(--gold-soft),rgba(40,30,0,0.5));
    border-color:var(--gold-edge);
    box-shadow:0 4px 20px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06),0 0 14px rgba(255,200,0,0.08);
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 4px 20px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.06),0 0 14px rgba(204,0,0,0.08)}
    50%{box-shadow:0 4px 20px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.10),0 0 28px rgba(204,0,0,0.20)}
  }
  .kpi-label{font-size:0.6rem;color:var(--mute);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
  .kpi-value{font-size:1.85rem;font-weight:800;color:#fff;text-shadow:0 0 12px var(--red-glow);line-height:1.05;letter-spacing:0.5px}
  .kpi-card.blue .kpi-value{text-shadow:0 0 12px var(--blue-glow)}
  .kpi-card.gold .kpi-value{color:var(--gold);text-shadow:0 0 12px rgba(255,200,0,0.4)}
  .kpi-sub{font-size:0.7rem;color:var(--mute);margin-top:4px;line-height:1.3}
  .kpi-sub b{color:#fff;font-weight:600}
  .kpi-note{font-size:0.55rem;color:#888;margin-top:6px;font-style:italic;line-height:1.2}
  .kpi-delta{font-size:0.72rem;font-weight:700;margin-top:3px}
  .kpi-delta.up{color:var(--ok)}
  .kpi-delta.down{color:var(--bad)}
  .kpi-delta.flat{color:var(--mute)}

  /* MIDDLE GRID */
  .mid-grid{display:grid;grid-template-columns:1.1fr 1.4fr;gap:18px;margin-bottom:18px}
  .panel{
    background:var(--card-bg);border:1px solid var(--card-bd);border-radius:14px;
    padding:14px 16px 12px;backdrop-filter:blur(8px);
  }
  .panel-title{
    font-size:0.78rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;
    color:#fff;border-bottom:2px solid rgba(204,0,0,0.3);padding-bottom:7px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-title small{font-size:0.6rem;color:var(--dim);font-weight:500;letter-spacing:1.5px}

  /* PIPELINE FUNNEL */
  .funnel{display:flex;flex-direction:column;gap:6px}
  .funnel-row{
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
    background:linear-gradient(90deg,rgba(204,0,0,0.20),rgba(204,0,0,0.04));
    border-left:3px solid var(--red);border-radius:6px;padding:8px 12px;
    position:relative;
  }
  .funnel-row.gold{background:linear-gradient(90deg,rgba(255,200,0,0.18),rgba(255,200,0,0.03));border-left-color:var(--gold)}
  .funnel-row.blue{background:linear-gradient(90deg,rgba(78,168,255,0.18),rgba(78,168,255,0.03));border-left-color:var(--blue)}
  .funnel-row.green{background:linear-gradient(90deg,rgba(61,220,145,0.16),rgba(61,220,145,0.02));border-left-color:var(--green)}
  .funnel-name{font-size:0.85rem;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:0.5px}
  .funnel-meta{font-size:0.65rem;color:var(--mute);margin-top:2px;letter-spacing:1px}
  .funnel-amt{font-size:1.1rem;font-weight:800;color:#fff;text-align:right}

  /* ESTIMATOR TABLE */
  table.est{width:100%;border-collapse:collapse;font-size:0.8rem}
  .est th{
    text-align:left;font-size:0.6rem;font-weight:700;color:var(--mute);
    text-transform:uppercase;letter-spacing:1.5px;padding:6px 8px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .est th.r,.est td.r{text-align:right}
  .est td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.04);color:#fff}
  .est td.name{font-weight:700;letter-spacing:0.5px}
  .est td.amt{font-weight:700}
  .est .hit-good{color:var(--ok);font-weight:700}
  .est .hit-warn{color:var(--warn);font-weight:700}
  .est .hit-bad{color:var(--bad);font-weight:700}
  .est .hit-na{color:var(--dim);font-weight:500;font-style:italic}

  /* BOTTOM GRID */
  .bot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}

  /* WEEKLY CHART */
  .weekly-chart{height:260px;position:relative;padding:6px 4px 24px 36px}
  .chart-svg{width:100%;height:100%}

  /* TOP CUSTOMERS */
  .cust-list{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
  .cust-row{
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
    padding:7px 10px;background:rgba(255,255,255,0.02);border-radius:6px;
    border-left:2px solid rgba(204,0,0,0.5);
  }
  .cust-name{font-size:0.78rem;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cust-amt{font-size:0.85rem;color:#fff;font-weight:700;text-shadow:0 0 6px var(--red-glow)}

  /* AGING BIDS */
  .aging-list{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
  .aging-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    padding:7px 10px;background:rgba(255,180,0,0.05);border-radius:6px;
    border-left:2px solid var(--warn);
  }
  .aging-row.hot{background:rgba(255,90,90,0.07);border-left-color:var(--bad)}
  .aging-job{font-size:0.7rem;color:var(--mute);font-family:'Consolas',monospace}
  .aging-co{font-size:0.78rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aging-meta{font-size:0.7rem;color:var(--warn);font-weight:700;text-align:right;white-space:nowrap}
  .aging-row.hot .aging-meta{color:var(--bad)}

  /* LEAD PANEL */
  .lead-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
  .lead-tier{
    background:linear-gradient(135deg,rgba(78,168,255,0.10),rgba(5,15,30,0.4));
    border:1px solid rgba(78,168,255,0.30);border-radius:10px;
    padding:10px 8px;text-align:center;
  }
  .lead-tier.a{border-color:rgba(61,220,145,0.4);background:linear-gradient(135deg,rgba(61,220,145,0.12),rgba(5,30,15,0.4))}
  .lead-tier.b{border-color:rgba(78,168,255,0.4)}
  .lead-tier.c{border-color:rgba(255,200,0,0.35);background:linear-gradient(135deg,rgba(255,200,0,0.10),rgba(40,30,0,0.4))}
  .lead-tier.d{border-color:rgba(170,170,170,0.3);background:linear-gradient(135deg,rgba(170,170,170,0.08),rgba(20,20,20,0.4))}
  .lt-name{font-size:0.6rem;color:var(--mute);letter-spacing:2px;text-transform:uppercase}
  .lt-count{font-size:1.5rem;font-weight:800;color:#fff;margin-top:3px}
  .lt-value{font-size:0.7rem;color:var(--mute);margin-top:2px}
  .lead-out{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .lo-cell{
    background:rgba(255,255,255,0.03);border-radius:6px;padding:6px 8px;text-align:center;
    border:1px solid rgba(255,255,255,0.05);
  }
  .lo-cell.active{border-color:rgba(78,168,255,0.3);background:rgba(78,168,255,0.06)}
  .lo-name{font-size:0.55rem;color:var(--mute);letter-spacing:1px;text-transform:uppercase}
  .lo-count{font-size:0.95rem;font-weight:700;color:#fff;margin-top:2px}

  .loading{padding:30px;text-align:center;color:var(--dim);letter-spacing:2px}
  .warn-strip{
    margin-bottom:14px;padding:8px 14px;
    background:rgba(255,200,0,0.08);border:1px solid var(--gold-edge);border-radius:8px;
    font-size:0.72rem;color:var(--gold);letter-spacing:1px;
  }
  .warn-strip b{color:#ffe680}

  /* CHART */
  .chart-axis{stroke:rgba(255,255,255,0.15);stroke-width:1}
  .chart-grid{stroke:rgba(255,255,255,0.05);stroke-width:1}
  .chart-bar-bid{fill:rgba(78,168,255,0.55)}
  .chart-line-won{stroke:var(--red);stroke-width:2.5;fill:none;filter:drop-shadow(0 0 4px var(--red-glow))}
  .chart-line-wonLY{stroke:rgba(255,255,255,0.35);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
  .chart-dot-won{fill:var(--red);stroke:#fff;stroke-width:1}
  .chart-label{fill:var(--mute);font-size:9px;font-family:Segoe UI}
  .chart-legend{display:flex;gap:14px;justify-content:flex-end;font-size:0.65rem;color:var(--mute);margin-top:-12px;margin-right:6px}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px}
  .leg-swatch{display:inline-block;width:12px;height:3px;vertical-align:middle}
  .leg-swatch.bid{background:rgba(78,168,255,0.55);height:8px}
  .leg-swatch.won{background:var(--red)}
  .leg-swatch.wonLY{background:rgba(255,255,255,0.35);border-top:1px dashed #fff;border-bottom:1px dashed #fff;height:5px}
</style>
</head>
<body>

<div class="header">
  <img class="logo" src="logo.png" alt="Cassidy Paving">
  <div class="hdiv"></div>
  <div class="htxt">
    <h1>SALES <span>DASHBOARD</span></h1>
    <p>Dan D'Ambrosio &middot; Live from Smartsheet</p>
  </div>
  <div class="asof" id="asof"></div>
</div>

<div id="warn-strip-container"></div>

<div id="content">
  <div class="loading">Loading sales data&hellip;</div>
</div>

<script>
const fmt$ = n => n == null ? '—' : '$' + Math.abs(n).toLocaleString('en-US', {maximumFractionDigits:0});
const fmt$M = n => n == null ? '—' : '$' + (n/1000000).toFixed(2) + 'M';
const fmt$K = n => {
  if (n == null) return '—';
  if (Math.abs(n) >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + Math.round(n).toLocaleString();
};
const fmt$Sm = fmt$K;
const fmtPct = n => n == null ? '—' : n.toFixed(0) + '%';
const fmtPctD = n => n == null ? '—' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';

function hitClass(p){ if (p == null) return 'hit-na'; if (p >= 50) return 'hit-good'; if (p >= 30) return 'hit-warn'; return 'hit-bad'; }
function deltaPctClass(delta){ if (delta == null) return 'flat'; if (delta > 2) return 'up'; if (delta < -2) return 'down'; return 'flat'; }
function deltaArrow(delta){ if (delta == null) return ''; if (delta > 2) return '▲'; if (delta < -2) return '▼'; return '—'; }

function relativeAge(ts){
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const m = Math.round((now - d)/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.round(m/60) + 'h ago';
  return Math.round(m/1440) + 'd ago';
}

function render(d){
  // As-of timestamp
  document.getElementById('asof').innerHTML =
    `<div><b>Updated</b> ${relativeAge(d.generatedAt)}</div>
     <div>${d.asOf.today}</div>`;

  // Data quality warning if needed
  const warnContainer = document.getElementById('warn-strip-container');
  const warns = [];
  if (d.kpis.soldMTD && !d.kpis.soldMTD.dateSignedPopulated){
    warns.push('Sold MTD uses <b>Date of Estimate</b> as the won-date — Date Signed is not populated in Smartsheet today.');
  }
  if (d.kpis.hitRate90d.lostCount === 0 && d.kpis.hitRate90d.wonCount > 0){
    warns.push('Hit Rate shows 100% because no "Bid Lost" rows exist in last 90 days — confirm losses are being recorded.');
  }
  if (warns.length){
    warnContainer.innerHTML = '<div class="warn-strip">⚠ ' + warns.join('  &nbsp;&middot;&nbsp;  ') + '</div>';
  }

  // ----- KPI strip -----
  const sm = d.kpis.soldMTD, bm = d.kpis.bidMTD, hr = d.kpis.hitRate90d;
  const lb = d.kpis.laborMonthBacklog, ps = d.kpis.avgPerSY;
  const soldDelta = sm.priorMonth > 0 ? ((sm.amount - sm.priorMonth) / sm.priorMonth * 100) : null;
  const bidDelta  = bm.priorMonth > 0 ? ((bm.amount - bm.priorMonth) / bm.priorMonth * 100) : null;

  const kpiHTML = `
    <div class="kpi-strip">
      <div class="kpi-card">
        <div class="kpi-label">Hit Rate · 90d</div>
        <div class="kpi-value">${fmtPct(hr.ratePct)}</div>
        <div class="kpi-sub"><b>${hr.wonCount}</b> won &nbsp;/&nbsp; <b>${hr.lostCount}</b> lost</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Sold MTD</div>
        <div class="kpi-value">${fmt$K(sm.amount)}</div>
        <div class="kpi-sub"><b>${sm.count}</b> jobs · prior month ${fmt$K(sm.priorMonth)}</div>
        <div class="kpi-delta ${deltaPctClass(soldDelta)}">${deltaArrow(soldDelta)} ${soldDelta != null ? fmtPctD(soldDelta) : ''}</div>
        ${!sm.dateSignedPopulated ? '<div class="kpi-note">⚠ by Date of Estimate</div>' : ''}
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">Bid MTD</div>
        <div class="kpi-value">${fmt$K(bm.amount)}</div>
        <div class="kpi-sub"><b>${bm.count}</b> bids · prior month ${fmt$K(bm.priorMonth)}</div>
        <div class="kpi-delta ${deltaPctClass(bidDelta)}">${deltaArrow(bidDelta)} ${bidDelta != null ? fmtPctD(bidDelta) : ''}</div>
      </div>
      <div class="kpi-card gold">
        <div class="kpi-label">Labor-Month Backlog</div>
        <div class="kpi-value">${lb.months != null ? lb.months.toFixed(1) : '—'}</div>
        <div class="kpi-sub"><b>${lb.totalCrewDays}</b> open crew-days &middot; ${lb.capacityCrewDaysPerMonth}/mo capacity</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">Avg $/SY · last 30d</div>
        <div class="kpi-value">${ps.last30 != null ? '$' + ps.last30.toFixed(0) : '—'}</div>
        <div class="kpi-sub">prior 30d ${ps.prior30 != null ? '$' + ps.prior30.toFixed(0) : '—'} · n=${ps.sampleSizeRecent}</div>
        <div class="kpi-delta ${deltaPctClass(ps.deltaPct)}">${deltaArrow(ps.deltaPct)} ${ps.deltaPct != null ? fmtPctD(ps.deltaPct) : ''}</div>
      </div>
    </div>`;

  // ----- Pipeline + Estimators -----
  const stageColors = ['', 'gold', 'blue', 'green'];
  const funnelHTML = d.pipeline.stages.map((s, i) => `
    <div class="funnel-row ${stageColors[i]||''}">
      <div>
        <div class="funnel-name">${s.name}</div>
        <div class="funnel-meta">${s.count} job${s.count===1?'':'s'}</div>
      </div>
      <div class="funnel-amt">${fmt$K(s.amount)}</div>
    </div>`).join('');

  const estRows = d.estimators.map(e => `
    <tr>
      <td class="name">${e.name}</td>
      <td class="r">${e.bidsCount}</td>
      <td class="r amt">${fmt$K(e.bidsAmount)}</td>
      <td class="r">${e.wonCount}</td>
      <td class="r amt">${fmt$K(e.wonAmount)}</td>
      <td class="r ${hitClass(e.hitRatePct)}">${e.hitRatePct != null ? fmtPct(e.hitRatePct) : '—'}</td>
    </tr>`).join('') || '<tr><td colspan="6" style="color:#666;text-align:center;padding:14px">No estimator activity MTD</td></tr>';

  const midHTML = `
    <div class="mid-grid">
      <div class="panel">
        <div class="panel-title">Pipeline Funnel <small>$ in stage</small></div>
        <div class="funnel">${funnelHTML}</div>
      </div>
      <div class="panel">
        <div class="panel-title">Estimator Leaderboard <small>month-to-date</small></div>
        <table class="est">
          <thead>
            <tr><th>Estimator</th><th class="r">Bids</th><th class="r">$ Bid</th><th class="r">Won</th><th class="r">$ Won</th><th class="r">Hit %</th></tr>
          </thead>
          <tbody>${estRows}</tbody>
        </table>
      </div>
    </div>`;

  // ----- Weekly Chart -----
  const chartHTML = renderWeeklyChart(d.weeklySeries);

  // ----- Top Customers -----
  const custHTML = d.topCustomers.length
    ? d.topCustomers.map(c => `<div class="cust-row"><div class="cust-name">${c.name}</div><div class="cust-amt">${fmt$K(c.amount)}</div></div>`).join('')
    : '<div style="color:#666;text-align:center;padding:14px;font-size:0.75rem">No customers won MTD</div>';

  // ----- Aging Bids -----
  const agingHTML = d.agingOpenBids.length
    ? d.agingOpenBids.map(a => `
      <div class="aging-row ${a.ageDays > 30 ? 'hot':''}">
        <div class="aging-job">${a.jobNum}</div>
        <div class="aging-co">${a.company}</div>
        <div class="aging-meta">${a.ageDays}d &middot; ${fmt$K(a.amount)}</div>
      </div>`).join('')
    : '<div style="color:#666;text-align:center;padding:14px;font-size:0.75rem">No aging bids</div>';

  // ----- Lead Pipeline (Tier-2 panel) -----
  let leadHTML = '';
  if (d.leadPipeline){
    const lp = d.leadPipeline;
    const tiers = ['A-Tier','B-Tier','C-Tier','D-Tier'];
    const tierLetters = ['a','b','c','d'];
    const tierGrid = tiers.map((t, i) => `
      <div class="lead-tier ${tierLetters[i]}">
        <div class="lt-name">${t}</div>
        <div class="lt-count">${lp.tierCounts[t]||0}</div>
        <div class="lt-value">${fmt$K(lp.tierValue[t]||0)}</div>
      </div>`).join('');
    const outStages = ['Not Started','New Lead','Email Sent','Follow-up 1','Follow-up 2','Meeting Scheduled','Quoted','Closed Won','Closed Lost'];
    const outActive = outStages.filter(s => lp.outreachCounts[s]);
    const outHTML = outActive.map(s => `
      <div class="lo-cell ${s !== 'Not Started' ? 'active':''}">
        <div class="lo-name">${s}</div>
        <div class="lo-count">${lp.outreachCounts[s]}</div>
      </div>`).join('');
    leadHTML = `
      <div class="panel">
        <div class="panel-title">Lead Pipeline <small>Fructify Paving Intel · ${lp.totalLeads} leads · ${fmt$K(lp.totalValue)}</small></div>
        <div class="lead-grid">${tierGrid}</div>
        <div class="lead-out">${outHTML}</div>
      </div>`;
  }

  document.getElementById('content').innerHTML = kpiHTML + midHTML + `
    <div class="bot-grid">
      <div class="panel">
        <div class="panel-title">$ Bid vs Won — Last 13 Weeks
          <div class="chart-legend">
            <span><span class="leg-swatch bid"></span>$ Bid</span>
            <span><span class="leg-swatch won"></span>$ Won</span>
            <span><span class="leg-swatch wonLY"></span>Won LY</span>
          </div>
        </div>
        <div class="weekly-chart">${chartHTML}</div>
      </div>
      <div class="panel">
        <div class="panel-title">Top Customers MTD</div>
        <div class="cust-list">${custHTML}</div>
      </div>
      <div class="panel">
        <div class="panel-title">Aging Open Bids <small>&gt;14 days</small></div>
        <div class="aging-list">${agingHTML}</div>
      </div>
    </div>
    ${leadHTML}`;
}

function renderWeeklyChart(series){
  if (!series || !series.length) return '<div style="text-align:center;color:#666;padding:30px">No data</div>';
  const W = 600, H = 240, PAD_L = 36, PAD_R = 12, PAD_T = 10, PAD_B = 28;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
  const maxV = Math.max(1, ...series.map(s => Math.max(s.bid, s.won, s.wonLY)));
  const niceMax = Math.ceil(maxV / 1000000) * 1000000 || maxV;
  const xStep = innerW / series.length;
  const xCenter = i => PAD_L + xStep * (i + 0.5);
  const y = v => PAD_T + innerH - (v / niceMax) * innerH;

  // Y gridlines
  const gridY = [];
  for (let i = 0; i <= 4; i++){
    const v = (niceMax / 4) * i;
    const yp = y(v);
    gridY.push(`<line class="chart-grid" x1="${PAD_L}" x2="${W - PAD_R}" y1="${yp}" y2="${yp}"/>`);
    gridY.push(`<text class="chart-label" x="${PAD_L - 4}" y="${yp+3}" text-anchor="end">${v >= 1000000 ? '$' + (v/1000000).toFixed(1) + 'M' : '$' + Math.round(v/1000) + 'K'}</text>`);
  }
  // X labels every 2 weeks
  const xLabels = series.map((s, i) => {
    if (i % 2 !== 0 && i !== series.length - 1) return '';
    const d = new Date(s.weekStart);
    const lbl = (d.getMonth()+1) + '/' + d.getDate();
    return `<text class="chart-label" x="${xCenter(i)}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
  }).join('');

  // Bars: $ Bid
  const barW = Math.max(8, xStep * 0.65);
  const bars = series.map((s, i) => {
    const h = (s.bid / niceMax) * innerH;
    return `<rect class="chart-bar-bid" x="${xCenter(i) - barW/2}" y="${y(s.bid)}" width="${barW}" height="${h}" rx="2"/>`;
  }).join('');

  // Line: $ Won
  const wonPath = series.map((s, i) => `${i===0?'M':'L'}${xCenter(i)} ${y(s.won)}`).join(' ');
  // Line: $ WonLY
  const lyPath = series.map((s, i) => `${i===0?'M':'L'}${xCenter(i)} ${y(s.wonLY)}`).join(' ');
  const dots = series.map((s, i) => `<circle class="chart-dot-won" cx="${xCenter(i)}" cy="${y(s.won)}" r="3"/>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="none">
    ${gridY.join('')}
    ${bars}
    <path class="chart-line-wonLY" d="${lyPath}"/>
    <path class="chart-line-won" d="${wonPath}"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

async function load(){
  try{
    const r = await fetch('data.json?cb=' + Math.floor(Date.now()/60000));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch(e){
    document.getElementById('content').innerHTML = '<div class="loading">Failed to load data: ' + e.message + '</div>';
  }
}
load();
setInterval(load, 60000);  // refresh page data every 60 sec
</script>
